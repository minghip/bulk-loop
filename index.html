<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bulk Loop">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Bulk Loop</title>
<style>
html,body{height:100%;margin:0;background:#ffffff;overflow:hidden;overscroll-behavior:none}
@media (prefers-color-scheme:dark){html,body{background:#000000}}
/* Bulk Loop styles. Tokens live on .app so the same CSS works full-screen and inside the phone preview.
   Colour has four jobs, in this order:
     1. state of a day   green wash = done · orange ring = today · amber edge = unfinished past day
     2. what a block is  hue = body region (blue lower, purple upper, gold core); shade = A (bright) / B (deep);
                         tinted = short session; pill shape = ASVZ class or cardio
     3. actions          orange = primary buttons and timers
     4. everything else  neutral */
.app{
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --bg:#eef1f5; --card:#ffffff; --panel:#f3f5f8; --soft:#e8ecf1; --head:#ffffff;
  --ink:#141c26; --muted:#5b6878; --rule:#d8dee6;
  --far:#a9b4c1; --steel:#5c6d7e; --steel-2:#8796a6; --plate:#e3e8ee; --plate-line:#b6c1cc; --pad:#c9d2dc; --pad-2:#b5c0cc;
  --accent:#e8532a; --accent-ink:#ffffff; --accent-soft:#fdebe4;
  --good:#15803d; --good-solid:#16a34a; --done-bg:#dff5e6; --done-line:#8fd4a8;
  --warn:#9a5b06; --warn-solid:#d97706; --warn-bg:#fff6e1;
  --la:#2563eb; --lb:#1e3a8a; --ua:#9333ea; --ub:#6b21a8; --co:#eab308; --co-on:#2b1f00;
  --kondi:#dc2626; --yoga:#0f766e; --martial:#1f2937; --run:#be185d;
  --t-la:#1d4ed8; --t-lb:#1e3a8a; --t-ua:#7e22ce; --t-ub:#6b21a8;
  --mc-bg:#fef3c7; --mc-on:#713f12; --ml-bg:#dbeafe; --ml-on:#1e3a8a; --mb-bg:#f3e8ff; --mb-on:#581c87;
  --edge:transparent;
  --shadow:0 1px 2px rgba(20,30,45,.06),0 4px 14px rgba(20,30,45,.05);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);color:var(--ink);font:15px/1.4 var(--sys);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .app{
    --bg:#0c1117; --card:#161d26; --panel:#111821; --soft:#1e2733; --head:#000000;
    --ink:#e6ebf1; --muted:#95a3b2; --rule:#28323e;
    --far:#4b5765; --steel:#8b9cae; --steel-2:#6b7c8e; --plate:#25303b; --plate-line:#3a4655; --pad:#313c48; --pad-2:#3c4957;
    --accent:#ff7a4d; --accent-ink:#1d0c05; --accent-soft:#33190f;
    --good:#5fd39a; --good-solid:#1f9a55; --done-bg:#10291c; --done-line:#1f6b43;
    --warn:#f0b35a; --warn-solid:#d97706; --warn-bg:#2a2113;
    --martial:#475569;
    --t-la:#93c5fd; --t-lb:#8aa5ee; --t-ua:#d8b4fe; --t-ub:#c08cf5;
    --mc-bg:#3a2f0b; --mc-on:#fde68a; --ml-bg:#14254d; --ml-on:#bfdbfe; --mb-bg:#2c1a47; --mb-on:#e9d5ff;
    --edge:rgba(255,255,255,.16);
    --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"] .app{
  --bg:#0c1117; --card:#161d26; --panel:#111821; --soft:#1e2733; --head:#000000;
  --ink:#e6ebf1; --muted:#95a3b2; --rule:#28323e;
  --far:#4b5765; --steel:#8b9cae; --steel-2:#6b7c8e; --plate:#25303b; --plate-line:#3a4655; --pad:#313c48; --pad-2:#3c4957;
  --accent:#ff7a4d; --accent-ink:#1d0c05; --accent-soft:#33190f;
  --good:#5fd39a; --good-solid:#1f9a55; --done-bg:#10291c; --done-line:#1f6b43;
  --warn:#f0b35a; --warn-solid:#d97706; --warn-bg:#2a2113;
  --martial:#475569;
  --t-la:#93c5fd; --t-lb:#8aa5ee; --t-ua:#d8b4fe; --t-ub:#c08cf5;
  --mc-bg:#3a2f0b; --mc-on:#fde68a; --ml-bg:#14254d; --ml-on:#bfdbfe; --mb-bg:#2c1a47; --mb-on:#e9d5ff;
  --edge:rgba(255,255,255,.16);
  --shadow:none;
  color-scheme:dark;
}
.app *{box-sizing:border-box}
:where(.app) button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none;text-align:inherit}
.app button:disabled{opacity:.4;cursor:default}
.app [data-act]{cursor:pointer}   /* also tells iOS Safari that non-button rows are tappable */
.app :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app h1,.app h2,.app h3{font-family:var(--round);margin:0;letter-spacing:-.01em}
.app p{margin:0}

/* activity colours: --f fill, --o text on the fill, --e edge */
.act-la{--f:var(--la);--o:#fff}
.act-lb{--f:var(--lb);--o:#fff}
.act-ua{--f:var(--ua);--o:#fff}
.act-ub{--f:var(--ub);--o:#fff}
.act-c{--f:var(--co);--o:var(--co-on)}
.act-mc{--f:var(--mc-bg);--o:var(--mc-on);--e:var(--co)}
.act-ml{--f:var(--ml-bg);--o:var(--ml-on);--e:var(--la)}
.act-mb{--f:var(--mb-bg);--o:var(--mb-on);--e:var(--ua)}
.act-kondi{--f:var(--kondi);--o:#fff}
.act-yoga{--f:var(--yoga);--o:#fff}
.act-martial{--f:var(--martial);--o:#fff}
.act-run{--f:var(--run);--o:#fff}
.act-rest{--f:var(--soft);--o:var(--muted);--e:var(--rule)}
.q-la{--t:var(--t-la)} .q-ua{--t:var(--t-ua)} .q-lb{--t:var(--t-lb)} .q-ub{--t:var(--t-ub)}

/* top bar */
.top{flex:none;display:flex;align-items:center;gap:8px;padding:calc(var(--sat) + 6px) 12px 8px;background:var(--head);border-bottom:1px solid var(--rule)}
.top h1{flex:1;min-width:0;font-size:22px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{display:block;font:500 12.5px/1.2 var(--sys);color:var(--muted);letter-spacing:0;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.hbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--rule);flex:none}
.hbtn svg{width:18px;height:18px}
.back{display:inline-flex;align-items:center;gap:1px;height:36px;padding:0 13px 0 6px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font:700 14px var(--sys);flex:none}
.back svg{width:18px;height:18px}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px 12px 20px;display:flex;flex-direction:column;gap:8px}

/* tab bar */
.tabs{flex:none;display:flex;justify-content:space-around;padding:6px 6px calc(var(--sab) + 4px);background:var(--card);border-top:1px solid var(--rule)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11px/1.1 var(--sys);color:var(--muted);padding:4px 0;border-radius:10px}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--accent)}

/* cards and buttons */
.card{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:12px;background:var(--card);border:1px solid var(--rule);font-weight:600;font-size:14px;box-shadow:var(--shadow)}
.btn svg{width:16px;height:16px}
.btn.small{min-height:32px;padding:0 11px;font-size:13px;border-radius:10px}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;box-shadow:none;border-style:dashed;color:var(--muted)}
.btn.wide{width:100%}
.btn.danger{color:#c0392b}
.row-actions{display:flex;flex-wrap:wrap;gap:8px}
.hint{font-size:12px;color:var(--muted);text-align:center;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* cheat-day quest */
.quest{display:grid;gap:8px;padding:10px 12px 12px}
.quest.earned{background:var(--accent-soft);border-color:var(--accent)}
.q-head{display:flex;align-items:center;gap:10px}
.q-head h2{font-size:18px;font-weight:700}
.q-head p{font-size:12.5px;color:var(--muted);margin-top:1px}
.q-bank{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.q-bank b{font:700 15px var(--round);color:var(--ink)}
.qslots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.qslot{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 5px;border-radius:12px;background:var(--panel);border:1.5px solid var(--rule);font:700 12px/1.1 var(--round);color:var(--t);text-align:center}
.qslot i{width:22px;height:22px;border-radius:7px;border:2px solid var(--t);display:grid;place-items:center;color:#fff;background:var(--card)}
.qslot i svg{width:14px;height:14px}
.qslot.on{background:var(--done-bg);border-color:var(--done-line)}
.qslot.on i{background:var(--good-solid);border-color:var(--good-solid)}

/* plan check */
.plan{display:grid;gap:6px;padding:9px 12px 10px;border-left:4px solid var(--warn-solid);background:var(--warn-bg)}
.plan b{font-size:13.5px;color:var(--warn)}
.plan ul{margin:0;padding:0;list-style:none;display:grid;gap:3px;font-size:13px}
.plan li span{display:inline-block;min-width:34px;font:700 11.5px var(--mono);color:var(--warn)}
.plan .row-actions{margin-top:2px}
.plan .planhint{margin:0;font-size:12.5px;color:var(--muted)}

/* week: one box per day */
.days{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.days.dim .day{opacity:.5}
.wkcur{display:grid;gap:10px}
.wkhead{display:flex;align-items:baseline;gap:8px;margin:6px 4px -2px;font:700 13px var(--sys);color:var(--muted)}
.wkhead span{font:500 11.5px var(--mono)}
.day{position:relative;display:grid;grid-template-columns:30px 30px minmax(0,1fr) 46px;align-items:center;gap:7px;padding:6px 4px 6px 8px;min-height:57px;background:var(--card);border:1.5px solid var(--rule);border-radius:15px;box-shadow:var(--shadow);cursor:pointer}
.day.done{background:var(--done-bg);border-color:var(--done-line)}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent),var(--shadow)}
.day.missed::before{content:"";position:absolute;left:-1.5px;top:11px;bottom:11px;width:4px;border-radius:0 3px 3px 0;background:var(--warn-solid)}
.dcheck{width:30px;height:30px;border-radius:9px;border:2px solid var(--steel-2);display:grid;place-items:center;color:transparent;background:var(--card);font:700 9.5px var(--mono)}
.dcheck svg{width:18px;height:18px}
.dcheck.on{background:var(--good-solid);border-color:var(--good-solid);color:#fff}
.dcheck.part{border-color:var(--accent);color:var(--accent)}
.dcheck.none{border-style:dashed;border-color:var(--rule);background:transparent}
.ddate{display:flex;flex-direction:column;align-items:center;line-height:1.05;width:30px}
.ddate b{font:700 11px var(--sys);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ddate span{font:700 19px var(--round)}
.day.today .ddate b{color:var(--accent)}
.day.done .ddate b{color:var(--good)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:6px;min-width:0}
.slot{display:flex;min-width:0;border-radius:13px}
.slot.drop{outline:2.5px dashed var(--accent);outline-offset:1.5px;background:var(--accent-soft)}
.dtime{display:flex;flex-direction:column;align-items:center;gap:1px;width:46px;color:var(--muted)}
.dtime b{font:700 11.5px/1.2 var(--mono);color:var(--ink);white-space:nowrap}
.day.done .dtime b{color:var(--good)}
.dtime svg{width:14px;height:14px}
.cheatflag{position:absolute;top:-8px;right:12px;display:inline-flex;align-items:center;gap:3px;font:700 10px/1 var(--sys);padding:3px 7px;border-radius:999px;background:var(--accent);color:var(--accent-ink);pointer-events:none}
.cheatflag svg{width:10px;height:10px}

/* the coloured focus buttons */
.chip{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:2px;min-width:0;width:100%;height:42px;padding:4px 9px;border-radius:11px;background:var(--f);color:var(--o);box-shadow:inset 0 0 0 1.5px var(--e,var(--edge))}
.chip[data-chip]{touch-action:none;cursor:grab}
.chip .cn{display:block;max-width:100%;font:700 13.5px/1.1 var(--round);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.long .cn{font-size:12.5px;letter-spacing:-.02em}
.chip .cn svg{width:12px;height:12px;vertical-align:-1.5px;margin-right:3px}
.chip .ct{font:600 10.5px/1.1 var(--mono);opacity:.9;white-space:nowrap}
.chip.pill{border-radius:22px;padding-left:12px;padding-right:10px}
.chip.empty{align-items:center;background:transparent;color:var(--muted);box-shadow:none;border:1.5px dashed var(--steel-2);font:600 13px var(--sys)}
.chip.empty svg{width:17px;height:17px;opacity:.75}
.chip.dragging{opacity:.3}
.chip.big{flex-direction:row;align-items:center;gap:6px;width:auto;height:38px;padding:0 12px}
.chip.big .cn{font-size:16.5px}
.chip.big svg{width:14px;height:14px;flex:none}
.chip.tag{display:inline-flex;width:auto;height:auto;padding:4px 8px;border-radius:8px;font:700 12px/1 var(--round)}
.chip.tag.pill{border-radius:999px}

/* day view */
.summary{display:flex;align-items:center;gap:12px;padding:10px 12px}
.sum-txt{display:grid;gap:1px;font-size:13px;color:var(--muted);min-width:0}
.sum-txt b{font:700 16px var(--round);color:var(--ink)}
.ring{flex:none}
.ring .bgc{stroke:var(--soft)}
.ring .fg{stroke:var(--good-solid);transition:stroke-dashoffset .4s ease}
.ring text{fill:var(--ink);font:700 12.5px var(--round)}
.daydone{background:var(--done-bg);border-color:var(--done-line)}
.bhead{display:flex;align-items:center;gap:8px;margin-top:8px}
.bhead .sp{flex:1}
.ord{display:inline-flex;align-items:center;gap:4px;font:700 11px/1 var(--mono);color:var(--muted);border:1.5px solid var(--rule);border-radius:7px;padding:5px 6px;background:var(--card);flex:none}
.focus{font-size:13px;color:var(--muted);margin:-2px 2px 0}
.focus em{font-style:normal;color:var(--good);font-weight:700}
.items{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.item{display:flex;align-items:flex-start;gap:6px;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:8px 6px 8px 0;box-shadow:var(--shadow)}
.item.dragging{opacity:.35}
.item.done{background:var(--done-bg);border-color:var(--done-line)}
.grip{width:24px;align-self:stretch;display:grid;place-items:center;color:var(--steel-2);touch-action:none;flex:none;cursor:grab}
.grip svg{width:16px;height:16px}
.thumb{width:54px;height:54px;flex:none;border-radius:10px;background:var(--panel);display:grid;place-items:center;overflow:hidden;padding:3px}
.thumb svg{width:100%;height:100%}
.thumb.warm{color:var(--muted)}
.thumb.warm svg{width:26px;height:26px}
.ibody{flex:1;min-width:0;display:grid;gap:3px}
.iname{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.linklike{font:700 15px/1.2 var(--round);text-align:left}
.tagm{font:600 10px/1 var(--mono);text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:2px 4px}
.irx{font:500 12.5px/1.3 var(--mono);color:var(--muted)}
.sets{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:3px}
.setbox{width:38px;height:38px;border-radius:10px;border:2px solid var(--steel-2);display:grid;place-items:center;font:700 13px var(--mono);color:var(--ink);background:var(--card)}
.setbox.timed{width:auto;min-width:46px;padding:0 6px;border-style:dashed;border-color:var(--accent);color:var(--accent);font-size:12px}
.setbox.on{background:var(--good-solid);border:2px solid var(--good-solid);color:#fff}
.setbox svg{width:18px;height:18px}
.pm{display:inline-flex;margin-left:2px;border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--card)}
.pm button{width:34px;height:36px;font:600 18px var(--sys);color:var(--muted);text-align:center}
.pm button + button{border-left:1px solid var(--rule)}
.iside{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.mini{font:600 12px var(--sys);padding:6px 8px;border-radius:9px;border:1px solid var(--rule);background:var(--panel)}
.mini.icon{padding:5px 6px;display:grid;place-items:center}
.mini.icon svg{width:16px;height:16px}
.classcard{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.classcard .note{flex-basis:100%}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--card)}
.stepper button{width:36px;height:36px;font:600 18px var(--sys);color:var(--muted);text-align:center}
.stepper span{min-width:64px;text-align:center;font:700 13px var(--mono)}
.freecard{display:grid;gap:8px;text-align:center;padding:18px 12px}
.freecard p{font-size:13.5px;color:var(--muted)}
.cheatbar{display:flex;align-items:center;justify-content:center;gap:6px;font:700 13px var(--sys);padding:8px 12px;border-radius:12px;background:var(--accent);color:var(--accent-ink)}
.cheatbar svg{width:14px;height:14px}

/* library */
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.toggles button{font:600 13px var(--sys);padding:8px 11px;border-radius:999px;border:1px solid var(--rule);color:var(--muted);background:var(--card)}
.toggles button[aria-pressed="true"]{border-color:var(--ink);color:var(--card);background:var(--ink)}
.libgroup h3{font-size:16px;font-weight:700;margin:6px 2px 6px}
.librow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:6px 10px 6px 6px;box-shadow:var(--shadow)}
.librow + .librow{margin-top:6px}
.librow .t{display:grid;gap:2px;min-width:0}
.librow b{font:700 15px var(--round)}
.librow span{font:500 12px var(--mono);color:var(--muted)}

/* overlay: sheets, timer, toast, drag ghost */
.overlay{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:30}
.overlay > *{pointer-events:auto}
.backdrop{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(10,14,20,.42)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;display:flex;flex-direction:column;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet.enter{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--steel-2);margin:8px auto 0;flex:none}
.sheet-head,.grab{cursor:grab}
.sheet{will-change:transform}
.sheet-head{display:flex;align-items:flex-start;gap:10px;padding:10px 14px 8px}
.sheet-head > div{flex:1;min-width:0}
.sheet-head h2{font-size:20px;font-weight:700}
.sheet-head p{font:500 12.5px var(--mono);color:var(--muted);margin-top:3px}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 14px calc(var(--sab) + 16px);display:grid;gap:12px}
.field{display:grid;gap:6px}
.field > label{font:700 11.5px var(--sys);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pick .chip{height:46px}
.pick .chip.cur{outline:2.5px solid var(--ink);outline-offset:1.5px}
.wkrow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wkrow button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:10px;border:1px solid var(--rule);background:var(--card);font:700 15px var(--round)}
.wkrow button b{font:700 10.5px var(--sys);color:var(--muted)}
.wkrow button.cur{border-color:var(--ink);background:var(--soft)}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.figs figure{margin:0;background:var(--panel);border-radius:12px;padding:6px 6px 8px;display:grid;gap:4px;align-content:start}
.figs figcaption{font-size:12px;line-height:1.3;color:var(--muted)}
.figs figcaption b{display:block;font:700 11.5px/1.2 var(--sys);letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.cues{margin:0;padding-left:18px;font-size:14px;display:grid;gap:3px}
.note{font-size:13px;color:var(--muted)}
.note b{color:var(--ink)}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:6px 10px 6px 6px}
.opt .t{flex:1;display:grid;gap:2px;min-width:0}
.opt b{font:700 15px var(--round)}
.opt span{font:500 12px var(--mono);color:var(--muted)}
.opt em{font-style:normal;font:600 11px var(--sys);color:var(--yoga)}
.menu{display:grid;gap:6px}
.menu button{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px;font-weight:600}
.menu button span{font:500 12px var(--mono);color:var(--muted)}
.rlist{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.rlist li{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:12px;background:var(--card);border:1px solid var(--rule);font-size:13px}
.rlist li.chg{border-color:var(--accent)}
.rlist .rd{width:54px;font:700 12px var(--mono);color:var(--muted);flex:none}
.rlist .rc{flex:1;display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.rlist em{font-style:normal;font:700 10.5px var(--sys);color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.app textarea{width:100%;min-height:96px;border-radius:12px;border:1px solid var(--rule);background:var(--card);color:var(--ink);font:16px/1.3 var(--mono);padding:8px;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}   /* 16px: iOS zooms the page for smaller text fields */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-width:58px;height:40px;border-radius:11px;border:1px solid var(--rule);background:var(--card);font:700 13px var(--mono);text-align:center}

.timer{position:absolute;left:10px;right:10px;bottom:calc(var(--sab) + 70px);background:var(--ink);color:var(--bg);border-radius:20px;padding:14px;display:grid;gap:10px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.timer .tt{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.timer h3{font-size:15px;font-weight:700}
.timer .sub{font:500 12px var(--mono);opacity:.75}
.timer .big{font:700 52px/1 var(--round);text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.timer .bar{height:6px;border-radius:3px;background:rgba(127,127,127,.35);overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--accent)}
.timer .tb{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.timer .tb button{min-height:40px;border-radius:12px;background:rgba(127,127,127,.22);font:600 13.5px var(--sys);text-align:center}
.timer .tb button.go{background:var(--accent);color:var(--accent-ink)}
.restpill{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--sat) + 58px);display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:999px;padding:7px 7px 7px 16px;font:600 14px var(--sys);box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap}
.restpill b{font:700 16px var(--mono)}
.restpill button{background:rgba(127,127,127,.25);border-radius:999px;padding:6px 10px;font-size:12.5px}
.toast{position:absolute;left:12px;right:12px;bottom:calc(var(--sab) + 70px);display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:14px;padding:11px 12px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast span{flex:1}
.toast button{font-weight:700;color:var(--accent)}
.toast.win{background:var(--accent);color:var(--accent-ink)}
.toast.win button{color:var(--accent-ink);text-decoration:underline}
.overlay > .ghost{position:absolute;z-index:40;pointer-events:none;opacity:.96;box-shadow:0 14px 30px rgba(0,0,0,.3),inset 0 0 0 1.5px var(--e,var(--edge));transform:scale(1.06) rotate(-2deg)}
.overlay > li.ghost{transform:scale(1.02);box-shadow:0 16px 36px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){.sheet.enter{animation:none}.ring .fg{transition:none}}

/* exercise diagrams */
.fig{display:block;width:100%;height:auto}
.fig .bn,.fig .bf,.fig .halo,.fig .steel,.fig .mv,.fig .kb-h{fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .bn{stroke:var(--ink)} .fig .bn.fill{fill:var(--ink)}
.fig .bf{stroke:var(--far)} .fig .bf.fill{fill:var(--far)}
.fig .halo{stroke:var(--panel)} .fig .halo-f{fill:var(--panel)}
.fig .steel{stroke:var(--steel)} .fig .steel-f{fill:var(--steel)}
.fig .plate{fill:var(--plate);stroke:var(--steel-2)} .fig .plate-in{fill:none;stroke:var(--plate-line)}
.fig .pad{fill:var(--pad);stroke:var(--pad);stroke-linecap:round} .fig .pad-f{fill:var(--pad-2)}
.fig .db{fill:var(--plate);stroke:var(--steel)}
.fig .cable{stroke:var(--steel)} .fig .rail{stroke:var(--plate-line)}
.fig .floor{stroke:var(--rule)}
.fig .mv{stroke:var(--accent)} .fig .mvh{fill:var(--accent)}
.fig .guide{stroke:var(--steel-2)} .fig .kb-h{stroke:var(--steel)}
.thumb .fig .mv,.thumb .fig .mvh{display:none}

.ord svg{width:13px;height:13px}
.btn svg{width:15px;height:15px;vertical-align:-2px}

</style>

r knee near the floor","view":"Side view","muscles":"Quads · glutes"},{"id":"leg-press","name":"45° leg press","cat":"legs","kind":"acc","type":"reps","sets":3,"reps":"10–12","perSide":false,"rest":90,"rx":"3 × 10–12 · rest 90 s","alts":["goblet-squat","split-squat"],"cues":["Feet hip-width, middle of the plate.","Lower under control.","Do not lock the knees at the top."],"back":"Stop before your pelvis curls up off the seat.","evidence":"Machine-guided leg work with no bar on the spine.","start":"Legs nearly straight, knees unlocked","finish":"Lower until the knees are about 90°","view":"Side view","muscles":"Quads · glutes"},{"id":"leg-curl","name":"Lying leg curl","cat":"legs","kind":"acc","type":"reps","sets":3,"reps":"10–12","perSide":false,"rest":75,"rx":"3 × 10–12 · rest 75 s","alts":["seated-leg-curl","romanian-deadlift"],"cues":["Hips stay pressed into the pad.","Lower slowly, 2–3 s.","Full range, no kicking."],"back":"If the hips lift to finish a rep, the weight is too heavy.","evidence":"Trains the hamstrings at the knee, which hinges cover less.","start":"Legs straight, pad above the heels","finish":"Curl the heels toward the glutes","view":"Side view","muscles":"Hamstrings"},{"id":"seated-leg-curl","name":"Seated leg curl","cat":"legs","kind":"acc","type":"reps","sets":3,"reps":"10–12","perSide":false,"rest":75,"rx":"3 × 10–12 · rest 75 s","alts":["leg-curl","romanian-deadlift"],"cues":["Thigh pad snug just above the knees.","Lower slowly, 2–3 s.","Keep your back against the pad."],"back":"Seated with back support; very low back load.","evidence":"Hamstring isolation with the hips bent, so the muscle works at a longer length than in lying curls.","start":"Legs out straight, pad behind the ankles","finish":"Curl the heels down and back","view":"Side view","muscles":"Hamstrings"},{"id":"calf-raise","name":"Standing calf raise","cat":"legs","kind":"acc","type":"reps","sets":3,"reps":"12–15","perSide":false,"rest":60,"rx":"3 × 12–15 · rest 60 s","alts":[]," hest level","finish":"Press up over the chest","view":"Side view","muscles":"Chest · front shoulders · triceps"},{"id":"incline-db-press","name":"Incline dumbbell press","cat":"push","kind":"acc","type":"reps","sets":2,"reps":"8–10","perSide":false,"rest":90,"rx":"2 × 8–10 · rest 90 s","alts":["db-bench-press","bench-press"],"cues":["Bench at about 30°.","Elbows slightly tucked.","Control the bottom."],"back":"Low risk; keep your feet planted.","evidence":"Chest maintenance; low volume on purpose.","start":"Dumbbells at chest level","finish":"Press up above the shoulders","view":"Side view","muscles":"Upper chest · shoulders · triceps"},{"id":"seated-db-press","name":"Seated dumbbell press","cat":"push","kind":"main","type":"reps","sets":3,"reps":"8–10","perSide":false,"rest":120,"rx":"3 × 8–10 · rest 2 min","alts":[],"cues":["Back stays on the pad.","Forearms vertical.","Lower to ear height."],"back":"The back pad stops you leaning back under load.","evidence":"Mainstream; the supported version is chosen for your back.","start":"Dumbbells at the shoulders, back on the pad","finish":"Press up, arms nearly straight","view":"Side view","muscles":"Shoulders · triceps"},{"id":"pull-up","name":"Pull-up","cat":"pull","kind":"main","type":"reps","sets":3,"reps":"5–8","perSide":false,"rest":120,"rx":"3 × 5–8 · rest 2 min","alts":["lat-pulldown"],"cues":["Start each rep by pulling the shoulders down.","Drive the elbows toward the hips.","Lower under control to a full hang."],"back":"No kicking or swinging; use a band or the assisted machine instead.","evidence":"Mainstream back exercise.","start":"Dead hang, shoulders active","finish":"Chin over the bar","view":"Side view","muscles":"Lats · upper back · biceps"},{"id":"lat-pulldown","name":"Lat pulldown","cat":"pull","kind":"acc","type":"reps","sets":3,"reps":"10–12","perSide":false,"rest":90,"rx":"3 × 10–12 · rest 90 s","alts":["pull-up"],"cues":["Pull the elbows down to your sides.","Lean back 10–15°, then hold still.","Control the return."],"back":"No jerking with the torso.","evidence":"Mainstream; easier to load in small steps than pull-ups.","start":"Arms long, slight lean back","finish":"Bar to the upper chest","view":"Side view","muscles":"Lats · upper back · biceps"},{"id":"cable-row","name":"Seated cable row","cat":"pull","kind":"acc","type":"reps","sets":3,"reps":"10–12","perSide":false,"rest":90,"rx":"3 × 10–12 · rest 90 s","alts":["chest-supported-row","db-row"],"cues":["Chest up; the torso barely moves.","Squeeze the shoulder blades together.","Let the shoulders reach forward on the way back."],"back":"Do not rock the torso to move the weight.","evidence":"Seated row; no bent-over hold needed.","start":"Arms long, sit tall","finish":"Handle to the belly button","view":"Side view","muscles":"Mid back · lats · rear shoulders"},{"id":"chest-supported-row","name":"Chest-supported row","cat":"pull","kind":"acc","type":"reps","sets":3,"reps":"10–12","perSide":false,"rest":90,"rx":"3 × 10–12 · rest 90 s","alts":["cable-row","db-row"],"cues":["Chest stays on the pad.","Lead with the elbows.","Pause 1 s at the top."],"back":"The bench carries your torso, so the lower back barely works.","evidence":"Common supported row; removes the lower-back demand of bent-over rows.","start":"Chest on an incline bench, arms hanging","finish":"Row the dumbbells to your lower ribs","view":"Side view","muscles":"Mid back · lats · rear shoulders"},{"id":"db-row","name":"One-arm dumbbell row","cat":"pull","kind":"acc","type":"reps","sets":3,"reps":"10","perSide":true,"rest":75,"rx":"3 × 10 / side · rest 75 s","alts":["chest-supported-row","cable-row"],"cues":["Back flat, roughly parallel to the floor.","Pull toward the hip, not the chest.","Do not twist the torso open."],"back":"The bench supports your trunk; keep it square.","evidence":"Mainstream supported row.","start":"Hand and knee on the bench, arm long","finish":"Dumbbell to the hip","view":"Side view","muscles":"Lats · mid back"},{"id":"face-   const D = window.BULK_DATA;

  /* ---------- dates ---------- */
  const pad2 = n => String(n).padStart(2, '0');
  const toISO = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  const fromISO = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2], 12); };
  const addDays = (s, n) => { const d = fromISO(s); d.setDate(d.getDate() + n); return toISO(d); };

  const TODAY = toISO(new Date());
  const dayDiff = (a, b) => Math.round((fromISO(a) - fromISO(b)) / 864e5);

  function relDay(s) {
    const n = dayDiff(s, TODAY);
    return n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : n === -1 ? 'Yesterday' : n > 0 ? 'In ' + n + ' days' : -n + ' days ago';

    const a = fromISO(m), b = fromISO(addDays(m, 6));

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const kindOf = b => ACT[b.act].kind;
  const mkItem = (ex, sets) => ({ uid: uid(), ex, sets, done: new Array(sets).fill(false) });
  const mkBlock = (act, slot) => ({ id: uid(), act, slot: slot === 0 ? 0 : 1, items: null, done: false, mins: null });
  const blockAt = (d, pos) => d.blocks.find(b => b.slot === pos) || null;
  const bySlot = d => { d.blocks.sort((x, y) => x.slot - y.slot); return d; };
  const slotIcon = pos => (pos === 0 ? I.sun : I.moon);
  function tplItems(act) {
    const a = ACT[act], out = a.warm ? [mkItem('warm-up', 1)] : [];
    (a.items || []).forEach(p => out.push(mkItem(p[0], p[1])));
    return out;
  }
  const itemsOf = b => b.items || (b.items = tplItems(b.act));

  /* ---------- timer + rest ---------- */
  function timerNow() {
    const t = ui.timer, e = EX[t.ex];
    const left = Math.max(0, t.paused ? t.left : (t.endAt - Date.now()) / 1000), el = t.total - left;
    let sub = '';
    if (e.holds) sub = 'Hold ' + Math.min(e.holds, Math.floor((el % (t.total / (e.perSide ? 2 : 1))) / (e.secs[1] + 3)) + 1) + ' of ' + e.holds;
    if (e.perSide) sub += (sub ? ' · ' : '') + (el < t.total / 2 ? 'first side' : 'second side');
    const secs = Math.ceil(left);
    return { text: left <= 0 ? 'Done' : Math.floor(secs / 60) + ':' + pad2(secs % 60), sub, pct: Math.min(100, 100 * el / t.total).toFixed(1) };
  }
  function timerHTML() {
    const t = ui.timer;
    if (!t) return '';
    const e = EX[t.ex], n = timerNow();
    return '<section class="timer" role="timer" aria-live="off"><div class="tt"><h3>' + esc(e.name) + ' · set ' + (t.i + 1) + '</h3><span class="sub">' + esc(n.sub) + '</span></div>' +

  }
  function restHTML() {

  }

  function ensureTick() {
    wakeOn();
    if (tick) return;
    tick = setInterval(() => {
      const now = Date.now();
      const tm = ui.timer;
      if (tm && !tm.paused && !tm.half && EX[tm.ex] && EX[tm.ex].perSide && tm.endAt - now <= tm.total * 500) { tm.half = true; beep(2); }
      if (ui.timer && !ui.timer.paused && now >= ui.timer.endAt) finishTimer(true);
      if (ui.rest && now >= ui.rest.endAt) { ui.rest = null; beep(1); }
      if (!ui.timer && !ui.rest) { clearInterval(tick); tick = null; wakeOff(); }
      paintOverlay();
    }, 250);
  }
  function paintOverlay() {
    const ov = root.querySelector('.overlay');
    if (!ov || drag) return;

      const n = timerNow();
      t.querySelector('.big').textContent = n.text;
      t.querySelector('.sub').textContent = n.sub;
      t.querySelector('.bar i').style.width = n.pct + '%';
      t.querySelector('[data-act="timer-pause"]').textContent = ui.timer.paused ? 'Resume' : 'Pause';
    } else if (ui.timer || t) { render(); return; }
    const r = ov.querySelector('.restpill');

  /* ---------- actions ---------- */
  /* Where unticked work goes: the next unfinished main session from today on. A main lift looks for

  function nextTarget(st, date, bid, sameAct) {
    const open = b => b.id !== bid && kindOf(b) === 'lift' && ACT[b.act].loop && !bProg(b).done;
    const tests = sameAct ? [b => b.act === sameAct, b => !!ACT[b.act].lower === !!ACT[sameAct].lower, () => true] : [() => true];
    const start = date < TODAY ? TODAY : date;
    for (const t of tests) {

    const b = findBlock(date, bid);

    if (!left || it.ex === 'warm-up') return null;

    const target = nextTarget(S, date, bid, e.kind === 'main' && ACT[b.act].loop ? b.act : null);
    if (!target) return { none: e.name };

  }
  /* Move the block in slot si of day sd to slot dp of day dd. A block already there swaps back. */

      const r = p.el.getBoundingClientRect();
      drag = { kind: 'chip', el: p.el, ghost: ghostOf(p.el, r), pid: p.pid, offX: p.x0 - r.left, offY: p.y0 - r.top, over: null, date: p.el.dataset.date, idx: +p.el.dataset.slot };

    }
    if (!drag || e.pointerId !== drag.pid) return;
    e.preventDefault();
    const ar = root.getBoundingClientRect();
    drag.ghost.style.top = (e.clientY - ar.top - drag.offY) + 'px';
    if (drag.kind === 'item') {
      const sibs = Array.prototype.filter.call(drag.list.children, c => c !== drag.el);
      let before = null;
      for (let k = 0; k < sibs.length; k++) { const rr = sibs[k].getBoundingClientRect(); if (e.clientY < rr.top + rr.height / 2) { before = sibs[k]; break; } }
      if (before) { if (drag.el.nextSibling !== before) drag.list.insertBefore(drag.el, before); }
      else if (drag.list.lastElementChild !== drag.el) drag.list.appendChild(drag.el);
    } else {
      drag.ghost.style.left = (e.clientX - ar.left - drag.offX) + 'px';
      const under = document.elementFromPoint(e.clientX, e.clientY), row = under && under.closest ? under.closest('.day') : null;
      let slot = null;
      if (row && root.contains(row)) {

        if (!slot) {
          const sl = row.querySelectorAll('.slot'), r0 = sl[0].getBoundingClientRect(), r1 = sl[1].getBoundingClientRect();
          slot = Math.abs(e.clientX - (r0.left + r0.width / 2)) <= Math.abs(e.clientX - (r1.left + r1.width / 2)) ? sl[0] : sl[1];

    drag = null;
    swallow = true;
    setTimeout(() => { swallow = false; }, 0);

    }
  }
  /* Pull a sheet down to close it: by touch anywhere on it (unless its content is scrolled), by mouse on its header. */
  let pull = null;
  function pullStart(sh, x, y) { pull = { el: sh, x0: x, y0: y, dy: 0, on: false, t0: Date.now(), sheet: ui.sheet }; }
  function pullMove(x, y) {
    if (pull.closing) return true;
    const dy = y - pull.y0, dx = x - pull.x0;
    if (!pull.on) {
      if (dy <= 0 || Math.abs(dx) > Math.abs(dy)) { pull = null; return false; }   // scrolling the content or moving sideways
      pull.on = true; pull.el.style.transition = 'none';
    }
    pull.dy = Math.max(0, dy);
    pull.el.style.transform = 'translateY(' + pull.dy + 'px)';
    const bd = root.querySelector('.backdrop');
    if (bd) bd.style.opacity = String(Math.max(0.25, 1 - pull.dy / 420));
    return true;
  }
  function pullEnd() {
    const p = pull;
    if (!p || p.closing) return;
    pull = null;
    if (!p.on) return;
    const fast = p.dy > 28 && p.dy / Math.max(1, Date.now() - p.t0) > 0.55, bd = root.querySelector('.backdrop');
    p.el.style.transition = 'transform .18s ease-out';
    if (bd) bd.style.transition = 'opacity .18s';
    if (p.dy > 90 || fast) {
      p.el.style.transform = 'translateY(105%)';
      if (bd) bd.style.opacity = '0';
      pull = p; p.closing = true;   // keeps the page from redrawing under the closing sheet
      setTimeout(() => { pull = null; if (ui.sheet === p.sheet) ui.sheet = null; render(); }, 170);
    } else {
      p.el.style.transform = '';
      if (bd) bd.style.opacity = '';
      setTimeout(() => { if (!pull && !drag) render(); }, 200);   // catch up on anything that changed during the pull
    }
  }
  root.addEventListener('touchstart', e => {
    const sh = e.target.closest ? e.target.closest('.sheet') : null;
    if (!sh || e.touches.length !== 1 || drag || pull) return;
    if (e.target.closest('textarea')) return;
    const body = sh.querySelector('.sheet-body');
    if (body && body.contains(e.target) && body.scrollTop > 0) return;
    pullStart(sh, e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  root.addEventListener('touchmove', e => {
    if (!pull) return;
    if (pullMove(e.touches[0].clientX, e.touches[0].clientY) && e.cancelable) e.preventDefault();
  }, { passive: false });
  root.addEventListener('touchend', pullEnd);
  root.addEventListener('touchcancel', pullEnd);
  root.addEventListener('mousedown', e => {
    const hd = e.target.closest ? e.target.closest('.sheet-head, .grab') : null;
    if (!hd || e.button > 0 || pull || e.target.closest('button')) return;
    pullStart(hd.closest('.sheet'), e.clientX, e.clientY);
    const mv = ev => { if (pull) pullMove(ev.clientX, ev.clientY); };
    const up = () => { document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); if (pull && pull.on) { swallow = true; setTimeout(() => { swallow = false; }, 0); } pullEnd(); };
    document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
  });
  root.addEventListener('pointerup', e => endPointer(e, false));
  root.addEventListener('pointercancel', e => endPointer(e, true));

  /* ---------- render ---------- */
  let lastKey = '';
  function render(resetScroll) {
    if (drag || (pull && pull.on)) return;
    const c0 = root.querySelector('.content'), sb0 = root.querySelector('.sheet-body');
    const key = ui.view + (ui.view === 'day' ? ui.day : ui.view === 'week' ? ui.week : ui.lib);
    const keep = c0 && key === lastKey && !resetScroll ? c0.scrollTop : 0;
    const keepSheet = sb0 && ui.sheet && !ui.sheet.fresh ? sb0.scrollTop : 0;
    const body = ui.view === 'week' ? weekView() : ui.view === 'day' ? dayView() : libView();
    root.innerHTML = topBar() + '<main class="content">' + body + '</main>' + tabBar() +
      '<div class="overlay">' + sheetHTML() + timerHTML() + restHTML() + toastHTML() + '</div>';
    const c = root.querySelector('.content'), sb = root.querySelector('.sheet-body');
    c.scrollTop = keep;
    if (ui.view === 'week' && (resetScroll || key !== lastKey)) {   // start on the week in focus; last week is above, next week below
      const an = c.querySelector('.wkcur');
      if (an) c.scrollTop = Math.max(0, an.offsetTop - c.offsetTop - 10);
    }
    if (sb && keepSheet) sb.scrollTop = keepSheet;
    if (ui.scrollTo) {
      const el = root.querySelector('[data-block="' + ui.scrollTo + '"]');
      ui.scrollTo = null;
      if (el) c.scrollTop = Math.max(0, el.offsetTop - c.offsetTop - 8);
    }
    lastKey = key;
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    if (toISO(new Date()) !== TODAY) { location.reload(); return; }
    if (ui.timer || ui.rest) wakeOn();
    render();
  });
  render();
})();

</script>
</body>
</html>
